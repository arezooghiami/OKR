<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKR — چهار جهت طراحی پویا</title>
<style>
@font-face{font-family:Vazirmatn;font-weight:400;src:url(fonts/Vazirmatn-Regular.woff2) format("woff2");font-display:swap}
@font-face{font-family:Vazirmatn;font-weight:500;src:url(fonts/Vazirmatn-Medium.woff2) format("woff2");font-display:swap}
@font-face{font-family:Vazirmatn;font-weight:600;src:url(fonts/Vazirmatn-SemiBold.woff2) format("woff2");font-display:swap}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(fonts/Vazirmatn-Bold.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;margin:0}
:root{--font:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif}
html,body{background:#14161c}
body{font:400 14px/1.8 var(--font);color:#e9ebf1;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #7c5cff;outline-offset:2px;border-radius:6px}
svg{display:block}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ───────── picker ───────── */
.picker{position:sticky;top:0;z-index:50;background:rgba(20,22,28,.9);backdrop-filter:blur(12px);border-bottom:1px solid #262a35;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.picker b{font-size:15px}
.seg{display:flex;gap:4px;background:#1d2029;padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;color:#aab0c0;font-weight:500;transition:.2s}
.seg button:hover{color:#fff}
.seg button.on{background:#fff;color:#14161c;font-weight:700}
.brief{max-width:1240px;margin:16px auto 0;padding:0 18px;color:#aeb4c4;line-height:2}
.brief strong{color:#fff}
.stage{max-width:1240px;margin:14px auto 60px;padding:0 18px}

/* ───────── shared app scaffolding ───────── */
.app{display:none;border-radius:22px;overflow:hidden;position:relative;background:var(--bg);color:var(--tx);min-height:760px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.app.show{display:flex}
.app .screen{display:none;flex:1;min-width:0}
.app .screen.show{display:block;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mut{color:var(--mut)}
.ic{display:grid;place-items:center}
h1{font-size:22px;font-weight:700;line-height:1.5}
h2{font-size:15px;font-weight:700}
.tiny{font-size:12px}
.btn{border:0;border-radius:var(--rb,12px);padding:9px 18px;font-weight:600;background:var(--btn);color:var(--btntx);transition:transform .18s,box-shadow .18s,filter .18s;display:inline-flex;align-items:center;gap:8px}
a{text-decoration:none;color:inherit}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--okbg);color:var(--okx)}
.chip.risk{background:var(--rkbg);color:var(--rkx)}
.chip.bad{background:var(--bdbg);color:var(--bdx)}
.chip.none{background:var(--nbg);color:var(--mut)}
.chip.done{background:var(--ac);color:#fff}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative;display:inline-block}
.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:ping 1.8s infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.rg{stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1) .15s}
.go .rg{stroke-dashoffset:var(--off)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--barfill,var(--ac));transition:width 1.1s cubic-bezier(.2,.8,.2,1) .2s}
.go .bar i{width:var(--w)}
.hover-lift{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.hover-lift:hover{transform:translateY(-4px)}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 9px transparent}}
.go .stagger>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
.go .stagger>*:nth-child(1){animation-delay:.05s}.go .stagger>*:nth-child(2){animation-delay:.12s}.go .stagger>*:nth-child(3){animation-delay:.19s}.go .stagger>*:nth-child(4){animation-delay:.26s}.go .stagger>*:nth-child(5){animation-delay:.33s}.go .stagger>*:nth-child(6){animation-delay:.4s}.go .stagger>*:nth-child(7){animation-delay:.47s}.go .stagger>*:nth-child(8){animation-delay:.54s}

/* cycle stepper */
.cycle{display:flex;align-items:flex-start;gap:0}
.cycle .st{flex:1;text-align:center;position:relative;font-size:12.5px}
.cycle .st::before{content:"";position:absolute;top:13px;inset-inline:-50%;height:3px;background:var(--track);z-index:0}
.cycle .st:first-child::before{display:none}
.cycle .st.dn::before,.cycle .st.cur::before{background:var(--ac)}
.cycle .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;position:relative;z-index:1;display:grid;place-items:center;background:var(--card);border:3px solid var(--track);color:var(--mut);font-size:11px;font-weight:700}
.cycle .dn .dot{background:var(--ac);border-color:var(--ac);color:#fff}
.cycle .cur .dot{border-color:var(--ac);color:var(--ac);--glow:var(--ac);animation:pulse 2.2s infinite}
.cycle .cur b{color:var(--ac)}
.cycle small{display:block;color:var(--mut);font-size:11.5px}

/* entry table (shared) */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:right;font-weight:600;font-size:12px;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr.grp td{background:var(--sub);font-weight:700;font-size:13px;padding:9px 14px}
.tbl tbody tr:not(.grp){transition:background .15s}
.tbl tbody tr:not(.grp):hover{background:var(--sub)}
.tbl tr:last-child td{border-bottom:0}
.val{width:96px;text-align:center;padding:6px 8px;border-radius:9px;border:1.5px solid var(--bd);background:var(--card);transition:.18s;font-weight:700}
.val:hover{border-color:var(--ac)}
.val:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px var(--ring)}
.pc{display:flex;align-items:center;gap:10px;min-width:150px}
.pc b{min-width:42px}
.pc .bar{flex:1}
.pc .bar i{transition:width .5s cubic-bezier(.2,.8,.2,1),background .3s}
.toast{position:absolute;bottom:22px;inset-inline-start:50%;transform:translate(50%,30px);background:#111;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.35s;pointer-events:none;font-size:13px;z-index:20;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translate(50%,0)}
.kbd{border:1px solid var(--bd);border-radius:6px;padding:0 6px;font-size:11px;color:var(--mut);direction:ltr;display:inline-block}

/* ═════════ A — Aurora ═════════ */
.A{--bg:#f5f4ff;--tx:#1d1b3a;--mut:#6c6a8c;--card:rgba(255,255,255,.72);--bd:#e4e1fb;--sub:#f3f1ff;--ac:#6d4aff;--track:#e8e5fb;--btn:linear-gradient(135deg,#6d4aff,#3b82f6);--btntx:#fff;--ring:#6d4aff2e;--okbg:#d9f7e8;--okx:#0b6b3a;--rkbg:#fff0cf;--rkx:#8a4b00;--bdbg:#ffe0e4;--bdx:#a3122f;--nbg:#ecebf7;--ok:#16a870;--glow:#6d4aff55;--rb:14px;
background:radial-gradient(900px 500px at 85% -10%,#c9bcff 0,transparent 60%),radial-gradient(700px 500px at 0% 20%,#b8ecff 0,transparent 60%),radial-gradient(600px 500px at 60% 110%,#ffc9e3 0,transparent 60%),#f5f4ff}
.A .side{width:84px;margin:16px 16px 16px 0;border-radius:24px;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 10px 30px rgba(29,27,58,.1);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.A .logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#6d4aff,#ff6bb1);color:#fff;font-weight:800;display:grid;place-items:center;margin-bottom:12px;box-shadow:0 8px 20px rgba(29,27,58,.22)}
.A .nv{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#8a88aa;transition:.2s;position:relative}
.A .nv:hover{background:#efecff;color:#6d4aff;transform:scale(1.07)}
.A .nv.act{background:linear-gradient(135deg,#6d4aff,#3b82f6);color:#fff;box-shadow:0 8px 18px rgba(29,27,58,.2)}
.A .main{flex:1;padding:22px 24px;min-width:0}
.A .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.A .pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);border:1px solid #fff;border-radius:99px;padding:7px 16px;box-shadow:0 4px 14px rgba(29,27,58,.07);font-weight:600}
.A .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.A .gl{background:var(--card);backdrop-filter:blur(14px);border:1px solid #fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(29,27,58,.07)}
.A .hero{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,#5b3df5 0%,#3b82f6 55%,#22d3ee 100%);display:flex;align-items:center;gap:22px;box-shadow:0 18px 40px rgba(29,27,58,.28)}
.A .hero::before,.A .hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.A .hero::before{width:240px;height:240px;top:-110px;inset-inline-start:-60px;animation:float 9s ease-in-out infinite}
.A .hero::after{width:150px;height:150px;bottom:-70px;inset-inline-end:30%;animation:float 7s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(18px,14px) scale(1.08)}}
.A .hero>*{position:relative;z-index:1}
.A .hero .big{font-size:54px;font-weight:800;line-height:1.1}
.A .minis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.A .mini{background:rgba(255,255,255,.72);border:1px solid #fff;border-radius:20px;padding:14px 16px}
.A .mini .n{font-size:26px;font-weight:800}
.A .mini .tag{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:8px}
.A .units{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.A .u{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:#ffffffcc;border:1px solid #fff}
.A .u:hover{box-shadow:0 12px 26px rgba(29,27,58,.14)}
.A .alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:#fff;margin-top:10px;border:1px solid #f0edff}
.A .ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #ddd9f7}
.A .ev:last-child{border:0}
.A .date{width:48px;height:52px;border-radius:14px;background:linear-gradient(160deg,#fff,#efecff);border:1px solid #e4e1fb;text-align:center;font-size:11px;padding-top:6px;line-height:1.4;flex:none}
.A .date b{display:block;font-size:19px;color:#6d4aff;line-height:1.2}

/* ═════════ B — Pulse (dark) ═════════ */
.B{--bg:#080b14;--tx:#e8ecf8;--mut:#8a93ad;--card:#0f1424;--bd:#1c2440;--sub:#121a30;--ac:#35e0b5;--track:#1a2240;--btn:linear-gradient(135deg,#35e0b5,#3ab8ff);--btntx:#04121a;--ring:#35e0b533;--okbg:#0c3a30;--okx:#5df0c3;--rkbg:#3b2f0b;--rkx:#ffd36a;--bdbg:#3d1522;--bdx:#ff8fa3;--nbg:#1a2240;--ok:#35e0b5;--glow:#35e0b566;--rb:12px;
background:radial-gradient(800px 420px at 100% -10%,#1b2a6b66,transparent 60%),radial-gradient(700px 420px at 0% 100%,#0f5c5066,transparent 60%),#080b14}
.B .rail{width:72px;border-inline-start:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;background:#0a0e1a}
.B .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#35e0b5,#3ab8ff);color:#04121a;display:grid;place-items:center;font-weight:800;margin-bottom:14px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.B .nv{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#6f7895;transition:.2s;position:relative}
.B .nv:hover{color:#fff;background:#151c34}
.B .nv.act{color:#35e0b5;background:#102a35;box-shadow:inset 0 0 0 1px #35e0b544}
.B .nv.act::after{content:"";position:absolute;inset-inline-end:-13px;top:12px;bottom:12px;width:3px;border-radius:3px;background:#35e0b5}
.B .main{flex:1;padding:20px 24px;min-width:0}
.B .top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.B .search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:#0f1424;border:1px solid var(--bd);padding:9px 14px;border-radius:12px;color:var(--mut)}
.B .search:hover{border-color:#35e0b566}
.B .cyc{display:flex;gap:8px;align-items:center;background:#0f1424;border:1px solid var(--bd);padding:9px 14px;border-radius:12px}
.B .gl{background:linear-gradient(180deg,#111830,#0d1226);border:1px solid var(--bd);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.B .gl.glow::before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:linear-gradient(135deg,#35e0b5aa,transparent 40%,#3ab8ff88);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.B .g1{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.B .g2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.B .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.B .kpi .n{font-size:30px;font-weight:800;margin:2px 0;letter-spacing:-.5px}
.B .kpi .d{font-size:12px;font-weight:700}
.B .area path.line{stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1) .2s}
.B.go .area path.line{stroke-dashoffset:0}
.B .area .fill{opacity:0;transition:opacity 1.2s .9s}
.B.go .area .fill{opacity:1}
.B .lb{display:flex;align-items:center;gap:12px;padding:9px 0}
.B .lb .rank{width:26px;height:26px;border-radius:9px;background:#151c34;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}
.B .lb:nth-child(-n+3) .rank{background:linear-gradient(135deg,#35e0b5,#3ab8ff);color:#04121a}
.B .bar{height:7px;background:#1a2240}
.B .bar i{background:linear-gradient(90deg,#35e0b5,#3ab8ff);}
.B .feed>div{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #161d36;align-items:flex-start}
.B .feed>div:last-child{border:0}
.B .av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

/* ═════════ C — Bento (warm, playful-pro) ═════════ */
.C{--bg:#fff7ec;--tx:#2a1b12;--mut:#8a7565;--card:#fff;--bd:#f0e1cf;--sub:#fff4e3;--ac:#ff5a36;--track:#f5e7d5;--btn:#2a1b12;--btntx:#fff;--ring:#ff5a3630;--okbg:#d8f5df;--okx:#14602e;--rkbg:#ffe9a8;--rkx:#6b4300;--bdbg:#ffd9d1;--bdx:#8c1d0b;--nbg:#f5e7d5;--ok:#1fa15a;--glow:#ff5a3655;--rb:99px;
background:#fff7ec}
.C .main{flex:1;padding:22px 26px 110px;min-width:0}
.C .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.C h1{font-size:30px;letter-spacing:-.5px}
.C .bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(96px,auto);gap:14px}
.C .t{border-radius:28px;padding:20px;position:relative;overflow:hidden;background:#fff;border:1.5px solid var(--bd)}
.C .t.coral{background:#ff5a36;color:#fff;border:0}
.C .t.sun{background:#ffc83d;border:0}
.C .t.mint{background:#7be0b0;border:0}
.C .t.lilac{background:#c9b8ff;border:0}
.C .t.ink{background:#2a1b12;color:#fff;border:0}
.C .t .big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px}
.C .t.coral::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;border:34px solid rgba(255,255,255,.16);inset-inline-start:-60px;bottom:-80px;animation:float 8s ease-in-out infinite}
.C .t .lbl{font-weight:700;font-size:13px;opacity:.85}
.C .s1{grid-column:span 3;grid-row:span 2}.C .s2{grid-column:span 3}.C .s3{grid-column:span 1}.C .s4{grid-column:span 2}.C .s5{grid-column:span 3;grid-row:span 2}.C .s6{grid-column:span 3}
.C .dock{position:absolute;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 30px);background:#2a1b12;border-radius:99px;padding:8px;display:flex;gap:4px;box-shadow:0 18px 40px rgba(42,27,18,.35);z-index:10;overflow:auto}
.C .dock a{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;color:#d9c8b8;font-weight:600;white-space:nowrap;transition:.25s}
.C .dock a:hover{color:#fff;background:#4a3326}
.C .dock a.act{background:#ff5a36;color:#fff}
.C .bubbles{display:flex;gap:6px;flex-wrap:wrap}
.C .bubble{padding:5px 12px;border-radius:99px;background:rgba(42,27,18,.1);font-weight:600;font-size:12.5px}
.C .urow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1.5px dashed var(--bd)}
.C .urow:last-child{border:0}
.C .urow .av{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-weight:800;flex:none}
.C .bar{height:10px}
.C .tl{display:flex;gap:10px;margin-top:14px}
.C .tl div{flex:1;border-radius:16px;padding:10px;text-align:center;background:rgba(42,27,18,.08);font-size:12px;font-weight:600}
.C .tl .cur{background:#2a1b12;color:#fff;animation:pulse 2.2s infinite}
.C .tl .dn{background:rgba(42,27,18,.22)}

/* ═════════ D — Horizon (heat-matrix) ═════════ */
.D{--bg:#f7f8fc;--tx:#12162b;--mut:#646b88;--card:#fff;--bd:#e5e8f3;--sub:#f2f4fb;--ac:#4f46e5;--track:#e7e9f5;--btn:#4f46e5;--btntx:#fff;--ring:#4f46e533;--okbg:#d7f4e4;--okx:#0b5c33;--rkbg:#fdecc4;--rkx:#744000;--bdbg:#fddde0;--bdx:#8d1626;--nbg:#e9ebf5;--ok:#13a463;--glow:#4f46e555;--rb:10px;
flex-direction:column}
.D.show{display:flex}
.D .nav{display:flex;align-items:center;gap:24px;padding:0 24px;background:#fff;border-bottom:1px solid var(--bd);position:relative}
.D .nav::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#4f46e5,#ec4899,#f59e0b,#10b981,#06b6d4);opacity:.9}
.D .brand{font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center;padding:14px 0}
.D .brand i{width:30px;height:30px;border-radius:10px;background:conic-gradient(from 200deg,#4f46e5,#ec4899,#f59e0b,#10b981,#4f46e5);display:block;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.D .tabs{display:flex;gap:2px;flex:1}
.D .tabs a{padding:20px 14px 17px;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;transition:.2s}
.D .tabs a:hover{color:var(--tx)}
.D .tabs a.act{color:var(--ac);border-color:var(--ac)}
.D .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#f59e0b);color:#fff;display:grid;place-items:center;font-weight:700}
.D .body{padding:22px 24px;display:grid;grid-template-columns:1fr 340px;gap:18px;flex:1}
.D .card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(18,22,43,.04)}
.D .heat{width:100%;border-collapse:separate;border-spacing:6px}
.D .heat th{font-size:12px;color:var(--mut);font-weight:600;text-align:center;padding:2px}
.D .heat td.u{font-weight:700;padding:0 6px;white-space:nowrap}
.D .cell{border-radius:12px;padding:10px 0;text-align:center;font-weight:800;font-size:15px;transition:transform .2s,box-shadow .2s;cursor:pointer}
.go .cell{animation:pop .5s cubic-bezier(.2,1.2,.3,1) backwards;animation-delay:calc(var(--d)*45ms)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.D .cell:hover{transform:scale(1.08)!important;box-shadow:0 8px 20px rgba(18,22,43,.18);z-index:2;position:relative}
.D .cell.empty{background:repeating-linear-gradient(135deg,#f0f1f8 0 6px,#e8eaf4 6px 12px);color:#98a0bd;font-size:11px;font-weight:600}
.D .tr.sel td.u{color:var(--ac)}
.D .tr.sel .cell:not(.empty){outline:2.5px solid var(--ac);outline-offset:1px}
.D .legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.D .legend i{width:26px;height:10px;border-radius:5px;display:block}
.D .kr{padding:10px 0;border-bottom:1px solid var(--bd)}
.D .kr:last-child{border:0}
.D .score{display:flex;gap:16px;align-items:center}
.D .why{margin-top:12px;background:linear-gradient(135deg,#eef0ff,#fdf0f8);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.9}

@media(max-width:900px){
 .A .grid,.B .g1,.B .g2,.D .body{grid-template-columns:1fr}
 .B .kpis{grid-template-columns:1fr 1fr}
 .C .bento{grid-template-columns:repeat(2,1fr)}
 .C .s1,.C .s2,.C .s3,.C .s4,.C .s5,.C .s6{grid-column:span 2;grid-row:auto}
 .A .units{grid-template-columns:1fr}
 .A .side{width:64px}.D .tabs{overflow:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rg{stroke-dashoffset:var(--off)}.bar i{width:var(--w)}}

const ico=(k,s)=>`<svg class="i" ${s?`style="width:${s}px;height:${s}px"`:''} viewBox="0 0 24 24">${IC[k]}</svg>`;
function ring(p,size,stroke,col,track,txt){
  const off=264*(1-p/100);

  <circle class="rg" style="--off:${off}" cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round"/></svg>
  ${txt===false?'':`<div style="position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:${size*.26}px" class="num" data-count="${p}" data-suffix="٪">${P(p)}</div>`}</div>`;

/* ───────── entry table (shared, interactive) ───────── */
function calc(k,v){
  if(v===''||v==null||isNaN(v))return null;
  const asc=k.g>k.b; const p=asc?(v-k.b)/(k.g-k.b):(k.b-v)/(k.b-k.g);
  return Math.round(Math.max(0,Math.min(1,p))*100);
}
function entryHTML(c){

    rows+=`<tr class="grp"><td colspan="6"><span class="mut tiny">${grp.g} ◂</span> ${grp.o}</td></tr>`;

      const p=calc(k,k.v);
      rows+=`<tr data-k='${JSON.stringify({b:k.b,g:k.g})}'>

   </div>
   <div style="background:var(--card);border:1px solid var(--bd);border-radius:var(--rc,18px);overflow:auto">
    <table class="tbl"><thead><tr><th>#</th><th>نتیجه کلیدی</th><th>مبنا ← هدف</th><th>مقدار این پایش</th><th>پیشرفت</th><th>وضعیت</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="padding:11px 16px;background:var(--sub);display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px"><span class="saved">پیش‌نویس خودکار ذخیره می‌شود</span><span><span class="kbd">Tab</span> ردیف بعد · <span class="kbd">Esc</span> لغو</span></div>
   </div>

function wireEntry(root){
  const toast=root.querySelector('.toast');let tm;
  const upd=()=>{
    let sum=0,n=0,ok=0,bad=0,none=0;
    root.querySelectorAll('.entry tbody tr:not(.grp)').forEach(tr=>{
      const v=tr.querySelector('input').value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace('٫','.');
      const k=JSON.parse(tr.dataset.k);const p=calc({b:k.b,g:k.g},v===''?null:parseFloat(v));
      tr.querySelector('.pv').textContent=p==null?'—':P(p);
      const b=tr.querySelector('.bar i');b.style.setProperty('--w',(p||0)+'%');b.style.width=(p||0)+'%';
      const s=status(p);tr.querySelector('.st').innerHTML=`<span class="chip ${s[0]}">${s[1]}</span>`;
      n++;sum+=p||0;if(s[0]==='ok')ok++;else if(s[0]==='none')none++;else bad++;
    });
    const set=(k,v)=>root.querySelectorAll(`[data-stat=${k}]`).forEach(e=>e.textContent=v);
    set('avg',P(Math.round(sum/n)));set('ok',fa(ok));set('bad',fa(bad));set('none',fa(none));
  };
  root.querySelectorAll('.entry input').forEach(i=>{
    i.addEventListener('input',()=>{upd();clearTimeout(tm);
      root.querySelector('.saved').textContent='در حال ذخیره…';
      tm=setTimeout(()=>{root.querySelector('.saved').textContent='پیش‌نویس ذخیره شد ✓';toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1600)},600)});
    i.addEventListener('focus',()=>i.select());
  });
  upd();
}

     <div class="alert">${ico('down',20)}<div><b>واحد تولید ۱۴٪ افت کرد</b><div class="mut tiny">چرا؟ جزئیات سلامت را ببینید</div></div></div></div>
    <div class="gl" style="margin-top:16px"><h2 style="margin-bottom:6px">جلسات پیش رو</h2>
     ${[['۲۶','آبان','تولید · پایش ۲','۱۰:۳۰ · اتاق شورا'],['۲۷','آبان','کنترل کیفیت · پایش ۲','۱۴:۰۰ · آنلاین'],['۳۰','آبان','فروش صادراتی · پایش ۲','۰۹:۰۰ · اتاق ۲']].map(e=>`<div class="ev"><div class="date"><b>${e[0]}</b>${e[1]}</div><div><b>${e[2]}</b><div class="mut tiny">${e[3]}</div></div></div>`).join('')}</div>
   </div></div></div>`;
}

/* ───────── B · Pulse ───────── */
function areaChart(){
  const W=520,H=190,x=i=>W-20-i*(W-40)/4,y=v=>H-20-v*(H-40)/100;
  const act=[0,31,62], exp=[0,25,50,75,100];
  const pts=act.map((v,i)=>[x(i),y(v)]);
  const path='M'+pts.map(p=>p.join(',')).join(' L');
  const area=path+` L${pts[2][0]},${H-20} L${pts[0][0]},${H-20}Z`;
  const ex='M'+exp.map((v,i)=>[x(i),y(v)].join(',')).join(' L');
  const labels=['شروع','پایش ۱','پایش ۲','پایش ۳','نهایی'];
  return `<svg class="area" viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
   <defs><linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35e0b5" stop-opacity=".45"/><stop offset="1" stop-color="#35e0b5" stop-opacity="0"/></linearGradient><filter id="gw"><feGaussianBlur stdDeviation="3"/></filter></defs>
   ${[0,25,50,75,100].map(v=>`<line x1="20" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="#1c2440" stroke-dasharray="3 5"/><text x="${W-4}" y="${y(v)+4}" fill="#5d6685" font-size="10" text-anchor="end">${fa(v)}</text>`).join('')}
   <path d="${ex}" fill="none" stroke="#6f7aa5" stroke-width="2" stroke-dasharray="6 6"/>
   <path class="fill" d="${area}" fill="url(#fa)"/>
   <path class="line" d="${path}" fill="none" stroke="#35e0b5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
   <path class="line" d="${path}" fill="none" stroke="#35e0b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i==2?7:4.5}" fill="${i==2?'#35e0b5':'#080b14'}" stroke="#35e0b5" stroke-width="2.5"${i==2?' class="pulse" style="--glow:#35e0b5"':''}/>`).join('')}
   ${labels.map((l,i)=>`<text x="${x(i)}" y="${H-2}" fill="#8a93ad" font-size="11" text-anchor="middle">${l}</text>`).join('')}
  </svg>`;
}
function dashB(){
  const lb=[...UNITS].filter(u=>u.p[1]!=null).sort((a,b)=>b.p[1]-a.p[1]);
  const kp=[['امتیاز سازمان',62,'٪',15,'ac'],['KR روی مسیر',118,'',9,'ok'],['در خطر',34,'',-6,'rk'],['ثبت‌نشده',12,'',-18,'ok']];
  return `<div class="main"><div class="top">
   <div class="search">${ico('search',17)}<span>جستجوی واحد، هدف، KR…</span><span class="kbd" style="margin-inline-start:auto">Ctrl K</span></div>
   <div class="cyc"><span class="live"></span><b>بهار ۱۴۰۵</b><span class="mut">· پایش ۲</span></div>
   <button class="btn">${ico('file',16)} گزارش پایان پایش</button></div>
  <div style="margin-bottom:16px"><div class="mut tiny">نمای سازمان</div><h1>سازمان در مسیر ۶۲٪ از هدف</h1></div>
  <div class="kpis stagger">${kp.map(k=>`<div class="gl kpi hover-lift"><div class="mut tiny">${k[0]}</div><div class="n num" data-count="${k[1]}" data-suffix="${k[2]}">${fa(k[1])}${k[2]}</div><div class="d" style="color:${k[3]>0?(k[4]=='rk'?'#ff8fa3':'#35e0b5'):'#35e0b5'}">${k[3]>0?'▲':'▼'} ${fa(Math.abs(k[3]))} نسبت به پایش ۱</div></div>`).join('')}</div>
  <div class="g1"><div class="gl glow"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><h2>روند پیشرفت در برابر انتظار</h2><div class="tiny mut" style="display:flex;gap:14px"><span><b style="color:#35e0b5">━</b> واقعی</span><span><b style="color:#6f7aa5">╌</b> انتظار</span></div></div>${areaChart()}</div>
   <div class="gl"><h2>سلامت سازمان <span class="chip risk" style="margin-inline-start:6px">قابل بهبود</span></h2>
    <div style="display:flex;gap:16px;align-items:center;margin-top:12px">${ring(74,96,9,'#35e0b5','#1a2240')}
     <div class="tiny" style="line-height:2"><b>چرا ۷۴؟</b><br><span class="mut">دستاورد ۶۲٪ · ثبت‌شده ۹۵٪ · در خطر ۱۵٪ (کسر)</span></div></div>
    <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap"><span class="chip ok">۱۸۶ ثبت‌شده</span><span class="chip risk">۳۴ در خطر</span><span class="chip bad">۷ بدون مسئول</span></div></div></div>
  <div class="g2"><div class="gl"><div style="display:flex;justify-content:space-between"><h2>رتبه‌بندی واحدها</h2><span class="mut tiny">پایش ۲</span></div>
    <div class="stagger" style="margin-top:6px">${lb.map((u,i)=>`<div class="lb"><div class="rank num">${fa(i+1)}</div><div style="width:110px;font-weight:600">${u.n}</div><div style="flex:1">${bar(u.p[1])}</div><b class="num" style="width:44px;text-align:left">${P(u.p[1])}</b></div>`).join('')}</div></div>
   <div class="gl"><div style="display:flex;justify-content:space-between"><h2>فعالیت زنده</h2><span class="live"></span></div>
    <div class="feed stagger" style="margin-top:8px">
     ${[['ر','رضا کاظمی','مقدار KR ۲.۱ را ۶٫۸ ثبت کرد','۲ دقیقه پیش','#3ab8ff'],['ن','نگار احمدی','هدف KR ۱.۳ را اصلاح کرد (نسخه ۲)','۱۱ دقیقه پیش','#ff8fa3'],['س','سارا موسوی','مستند «گزارش خرید» را پیوست کرد','۳۸ دقیقه پیش','#ffd36a'],['ع','علی نجفی','جلسه تولید را «برگزار شد» زد','۱ ساعت پیش','#35e0b5']].map(a=>`<div><div class="av" style="background:${a[4]}22;color:${a[4]}">${a[0]}</div><div style="flex:1"><b>${a[1]}</b> <span class="mut">${a[2]}</span><div class="mut tiny">${a[3]}</div></div></div>`).join('')}</div></div></div></div>`;
}

/* ───────── C · Bento ───────── */
function dashC(){
  const av=['#ffc83d','#7be0b0','#c9b8ff','#ff9a7a','#8fd3ff','#ffc83d'];
  const top=[...UNITS].filter(u=>u.p[1]!=null).sort((a,b)=>b.p[1]-a.p[1]).slice(0,5);
  return `<div class="main"><div class="top"><div><div class="mut" style="font-weight:600">چرم مشهد · بهار ۱۴۰۵</div><h1>این هفته چطوریم؟</h1></div>
   <div style="display:flex;gap:10px"><button class="btn ghost" style="border-width:1.5px">${ico('search',16)} جستجو</button><button class="btn">+ ثبت مقدار</button></div></div>
   <div class="bento stagger">
    <div class="t coral s1"><div class="lbl">امتیاز کل سازمان</div><div class="big num" style="margin:14px 0 6px" data-count="62" data-suffix="٪">${P(62)}</div>
      <div style="font-weight:600;max-width:240px">۱۵٪ جلوتر از پایش قبل — فقط ۸٪ تا رسیدن به انتظار مانده!</div>
      <div class="bubbles" style="margin-top:18px"><span class="bubble" style="background:rgba(255,255,255,.22)">${fa(226)} نتیجه کلیدی</span><span class="bubble" style="background:rgba(255,255,255,.22)">${fa(23)} واحد</span></div></div>
    <div class="t sun s2"><div class="lbl">پایش ۲ · امروز</div><h2 style="font-size:20px;margin:6px 0 2px">جلسه واحد تولید</h2><div style="font-weight:600">فردا ساعت ۱۰:۳۰ · اتاق شورا</div>
      <div class="tl"><div class="dn">شروع</div><div class="dn">پایش ۱</div><div class="cur">پایش ۲</div><div>پایش ۳</div><div>نهایی</div></div></div>
    <div class="t mint s3"><div class="lbl">روی مسیر</div><div class="big num" style="font-size:44px;margin-top:10px" data-count="118">${fa(118)}</div></div>
    <div class="t lilac s4"><div class="lbl">در خطر</div><div class="big num" style="font-size:44px;margin-top:10px" data-count="34">${fa(34)}</div><div style="font-weight:600;margin-top:6px;font-size:12.5px">${ico('warn',14)} ۷ مورد بدون مسئول</div></div>
    <div class="t s5"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><h2>برترین واحدها</h2><span class="mut tiny">پایش ۲</span></div>
      ${top.map((u,i)=>`<div class="urow"><div class="av" style="background:${av[i]}">${u.n[0]}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><b>${u.n}</b><b class="num">${P(u.p[1])}</b></div>${bar(u.p[1],av[i]==='#ffc83d'?'#f2a900':'#ff5a36')}</div></div>`).join('')}</div>
    <div class="t ink s6"><div style="display:flex;justify-content:space-between;align-items:center"><h2>نیاز به اقدام</h2><span class="chip bad">۳</span></div>
      <div style="margin-top:10px;display:grid;gap:8px">${[['مالی: زمان جلسه تعیین نشده','clock'],['تولید: ۱۴٪ افت امتیاز','down'],['تأمین: ۳ KR ثبت‌نشده','warn']].map(a=>`<div style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);padding:10px 14px;border-radius:16px">${ico(a[1],18)}<span style="font-weight:500">${a[0]}</span><span style="margin-inline-start:auto;color:#ffc83d">←</span></div>`).join('')}</div></div>
   </div></div>
   <nav class="dock" aria-label="ناوبری">${[['home','خانه',1],['target','اهداف'],['cal','جلسات'],['users','سازمان'],['chart','گزارش‌ها'],['gear','تنظیمات']].map(n=>`<a href="#" class="${n[2]?'act':''}">${ico(n[0],18)}${n[1]}</a>`).join('')}</nav>`;
}

/* ───────── D · Horizon ───────── */
function heat(p){
  if(p==null)return null;
  const h=Math.round(p*1.25); // 0 red → 125 green
  return `background:hsl(${h} 72% ${p>60?84:88}%);color:hsl(${h} 70% 20%)`;
}
function unitPanel(u){
  const krs=[['افزایش فروش ماهانه',78,'ok'],['کاهش زمان تحویل سفارش',55,'risk'],['راه‌اندازی نمایندگی جدید',null,'none'],['رضایت مشتریان',91,'ok']];
  const s=u.p[1]??u.p[0];
  return `<div class="score">${ring(s,92,10,'#4f46e5','#e7e9f5')}<div><div class="mut tiny">${u.t}</div><h2 style="font-size:18px">${u.n}</h2>
   <span class="chip ${status(s)[0]}" style="margin-top:6px">${status(s)[1]}</span></div></div>
   <div class="why"><b>چرا ${fa(s)}٪؟</b><br>${u.noTime?'جلسه پایش ۲ هنوز زمان‌بندی نشده؛ آخرین امتیاز مربوط به پایش ۱ است.':`دستاورد KRها ${P(s)} است؛ ${fa(u.krs-u.ok)} مورد از ${fa(u.krs)} KR نیاز به توجه دارد. نسبت به پایش قبل ${u.d>=0?'+':'−'}${fa(Math.abs(u.d))}٪ تغییر کرده.`}</div>
   <h2 style="margin:16px 0 4px;font-size:14px">نتایج کلیدی</h2>
   ${krs.map(k=>`<div class="kr"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:500">${k[0]}</span>${chip(k[1])}</div>${bar(k[1]||0)}</div>`).join('')}
   <button class="btn" style="width:100%;justify-content:center;margin-top:14px">باز کردن صفحه واحد</button>`;
}
function dashD(){
  const rows=UNITS.map((u,i)=>`<tr class="tr${i==0?' sel':''}" data-i="${i}"><td class="u">${u.n}</td>${u.p.map((p,j)=>{
    const st=heat(p);return `<td><div class="cell ${p==null?'empty':''}" style="--d:${i*4+j};${st||''}">${p==null?(j==2?'بدون زمان':'هنوز نه'):fa(p)}</div></td>`}).join('')}</tr>`).join('');
  return `<nav class="nav"><div class="brand"><i></i>OKR</div>
    <div class="tabs">${['داشبورد','اهداف','جلسات','همترازی','تعهدات','گزارش‌ها','مدیریت'].map((t,i)=>`<a href="#" class="${i==0?'act':''}">${t}</a>`).join('')}</div>
    <div class="pill" style="font-weight:600;color:var(--mut)">${ico('search',16)} <span class="kbd">Ctrl K</span></div><div class="avatar">م</div></nav>
   <div class="body"><div>
     <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px;flex-wrap:wrap"><div><div class="mut tiny">چرخه بهار ۱۴۰۵ · پایش ۲ در جریان</div><h1>داشبورد سازمان</h1></div>
       <div style="display:flex;gap:10px"><button class="btn ghost">Excel</button><button class="btn">گزارش PDF</button></div></div>
     <div class="card" style="display:flex;gap:26px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
      ${ring(62,110,10,'url(#gd)','#e7e9f5')}<svg width="0" height="0"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs></svg>
      <div style="flex:1;min-width:200px"><div class="mut tiny">امتیاز سازمان</div><div style="font-size:15px;font-weight:600;margin-bottom:10px">۱۵٪ بهتر از پایش ۱ · انتظار تا امروز: ۷۰٪</div>
       <div class="stagger" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div style="background:#d7f4e4;border-radius:14px;padding:10px 14px"><div class="num" style="font-size:24px;font-weight:800;color:#0b5c33">${fa(118)}</div><div class="tiny" style="color:#0b5c33">روی مسیر</div></div><div style="background:#fdecc4;border-radius:14px;padding:10px 14px"><div class="num" style="font-size:24px;font-weight:800;color:#744000">${fa(34)}</div><div class="tiny" style="color:#744000">در خطر</div></div><div style="background:#e9ebf5;border-radius:14px;padding:10px 14px"><div class="num" style="font-size:24px;font-weight:800;color:#464d6e">${fa(12)}</div><div class="tiny" style="color:#464d6e">ثبت‌نشده</div></div></div></div></div>
     <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px"><h2>واحد × نقطه زمانی</h2>
      <div class="legend"><span>۰</span><i style="background:linear-gradient(90deg,hsl(0 72% 86%),hsl(60 72% 86%),hsl(125 72% 84%))"></i><span>۱۰۰</span></div></div>
      <table class="heat"><thead><tr><th></th>${POINTS.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
   </div>
   <aside class="card" id="dpanel" style="align-self:start;position:sticky;top:16px">${unitPanel(UNITS[0])}</aside></div>`;
}

/* ───────── assemble ───────── */
const CONF={
 A:{side:`<aside class="side"><div class="logo">OKR</div>${navItems.map((n,i)=>`<a class="nv ${i==0?'act':''}" href="#" title="${n[1]}" aria-label="${n[1]}">${ico(n[0],21)}</a>`).join('')}</aside>`,dash:dashA},
 B:{side:`<aside class="rail"><div class="logo">O</div>${navItems.map((n,i)=>`<a class="nv ${i==0?'act':''}" href="#" title="${n[1]}" aria-label="${n[1]}">${ico(n[0],20)}</a>`).join('')}</aside>`,dash:dashB},
 C:{side:'',dash:dashC},
 D:{side:'',dash:dashD}
};
const stage=document.getElementById('stage');
['A','B','C','D'].forEach(k=>{
  const c=CONF[k];
  stage.insertAdjacentHTML('beforeend',`<section class="app ${k}" data-c="${k}">${c.side}
   <div class="screen" data-s="dash" style="flex:1;min-width:0;${k==='D'?'display:none':''}">${c.dash()}</div>
   <div class="screen entry" data-s="entry" style="flex:1;min-width:0">${entryHTML(k)}</div>
   <div class="toast">${ico('check',16)} پیش‌نویس ذخیره شد</div></section>`);
});
// D uses column layout: dash is its own nav+body so unwrap
(function(){
  const d=stage.querySelector('.D');
  const dash=d.querySelector('[data-s=dash]');
  dash.style.cssText='';dash.classList.add('dwrap');
})();
document.querySelectorAll('.app').forEach(a=>wireEntry(a));
const qp=new URLSearchParams(location.search);
const st={c:'ABCD'.includes(qp.get('c')||'x')?qp.get('c'):'A',s:qp.get('s')==='entry'?'entry':'dash'};
function countUp(root){
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,suf=el.dataset.suffix||'';
    if(rm){el.textContent=fa(to)+suf;return}
    const t0=performance.now(),dur=1100;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fa(Math.round(to*e))+suf;if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function render(){
  document.querySelectorAll('.app').forEach(a=>{
    const on=a.dataset.c===st.c;a.classList.toggle('show',on);a.classList.remove('go');
    a.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',on&&s.dataset.s===st.s));
  });
  document.querySelectorAll('#segC button').forEach(b=>b.classList.toggle('on',b.dataset.c===st.c));
  document.querySelectorAll('#segS button').forEach(b=>b.classList.toggle('on',b.dataset.s===st.s));
  document.getElementById('brief').innerHTML=BRIEFS[st.c];
  const app=document.querySelector(`.app.${st.c}`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{app.classList.add('go');countUp(app.querySelector('.screen.show'))}));
}
document.querySelectorAll('#segC button').forEach(b=>b.onclick=()=>{st.c=b.dataset.c;render()});
document.querySelectorAll('#segS button').forEach(b=>b.onclick=()=>{st.s=b.dataset.s;render()});
// D heat-map drill-down
document.querySelectorAll('.D .tr').forEach(tr=>tr.addEventListener('click',()=>{
  document.querySelectorAll('.D .tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');
  const p=document.getElementById('dpanel');p.innerHTML=unitPanel(UNITS[+tr.dataset.i]);
  p.style.animation='none';p.offsetWidth;p.style.animation='rise .45s both';
  requestAnimationFrame(()=>p.classList.add('go'));
  p.querySelectorAll('.rg').forEach(r=>r.style.strokeDashoffset=r.style.getPropertyValue('--off'));
  p.querySelectorAll('.bar i').forEach(b=>b.style.width=b.style.getPropertyValue('--w'));
}));
render();
</script>
</body>
</html>
