<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKR — دقیق و رنگی (با فیلدهای واقعی اکسل)</title>
<style>
@font-face{font-family:Vazirmatn;font-weight:400;src:url(fonts/Vazirmatn-Regular.woff2) format("woff2");font-display:swap}
@font-face{font-family:Vazirmatn;font-weight:500;src:url(fonts/Vazirmatn-Medium.woff2) format("woff2");font-display:swap}
@font-face{font-family:Vazirmatn;font-weight:600;src:url(fonts/Vazirmatn-SemiBold.woff2) format("woff2");font-display:swap}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(fonts/Vazirmatn-Bold.woff2) format("woff2");font-display:swap}
:root{
 --bg:#f7f8fb;--panel:#fff;--hover:#f1f3f9;--sel:#e9eeff;--line:#e6e9f1;--line2:#d3d8e6;
 --tx:#161a2e;--mut:#5d6580;--faint:#646d88;--ac:#3b5bf0;--ac2:#8b5cf6;--acs:#3b5bf01f;
 --ok:#12875a;--risk:#c26a06;--bad:#d03a45;--none:#646d88;--track:#e6e9f1;
 --g0:#3b6cf0;--g1:#8b5cf6;--g2:#e5489b;--g3:#f08a24;--g4:#13a36b;--g5:#0aa5b8;
 --font:Vazirmatn,Tahoma,sans-serif}
:root[data-theme=dark]{
 --bg:#0c0d14;--panel:#14161f;--hover:#1b1e2a;--sel:#1d2342;--line:#23263a;--line2:#343853;
 --tx:#eceef8;--mut:#a0a6c0;--faint:#8c93af;--ac:#7f95ff;--ac2:#a98bff;--acs:#7f95ff26;
 --ok:#4cd197;--risk:#f0a94e;--bad:#ff7d86;--none:#8c93af;--track:#2a2d44;
 --g0:#7b9bff;--g1:#b095ff;--g2:#ff7bb8;--g3:#ffa85c;--g4:#4cd197;--g5:#4cd3e3}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 13.5px/1.75 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}svg{display:block}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.faint{color:var(--faint)}.tiny{font-size:12px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.kbd{display:inline-block;direction:ltr;font:500 11px/1 ui-monospace,Consolas,monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--mut);background:var(--panel)}
.ok{color:var(--ok)}.risk{color:var(--risk)}.bad{color:var(--bad)}.none{color:var(--none)}

/* top bar */
.bar{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;gap:6px;padding:0 20px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.bar::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--g0),var(--g1),var(--g2),var(--g3),var(--g4),var(--g5));opacity:.85}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding-inline-end:6px}
.logo i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--g0),var(--g1) 55%,var(--g2));color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
.ctx{display:flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-weight:500}
.ctx:hover{border-color:var(--line2)}
.ctx .lv{width:7px;height:7px;border-radius:50%;background:var(--g4);position:relative}
.ctx .lv::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--g4);animation:ping 2s infinite}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.7);opacity:0}}
.tabs{display:flex;gap:2px;margin-inline-start:10px}
.tab{padding:5px 13px;border-radius:8px;color:var(--mut);font-weight:500;transition:.15s}
.tab:hover{color:var(--tx);background:var(--hover)}
.tab.on{color:var(--tx);background:var(--hover);font-weight:600}
.sp{flex:1}
.cmd{display:flex;align-items:center;gap:9px;min-width:230px;padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--faint)}
.cmd:hover{border-color:var(--line2)}.cmd .kbd{margin-inline-start:auto}
.ib{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.ib:hover{background:var(--hover);color:var(--tx)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

.page{max-width:1120px;margin:0 auto;padding:28px 24px 100px}
.screen{display:none}.screen.on{display:block;animation:in .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.crumb{display:flex;gap:7px;color:var(--faint);margin-bottom:16px;font-size:12.5px}.crumb b{color:var(--mut);font-weight:500}

/* hero (tinted) */
.hero{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:end;margin-bottom:34px;padding:28px 32px;border-radius:22px;border:1px solid var(--line);position:relative;overflow:hidden;
 background:linear-gradient(115deg,color-mix(in srgb,var(--g0) 11%,var(--panel)),color-mix(in srgb,var(--g1) 9%,var(--panel)) 55%,color-mix(in srgb,var(--g2) 9%,var(--panel)))}
.big{font-size:62px;font-weight:600;line-height:1.1;letter-spacing:-2px;color:var(--tx)}
.big small{font-size:28px;letter-spacing:0}
.delta{display:inline-flex;gap:6px;align-items:center;color:var(--ok);font-weight:600;margin-top:4px}
.facts{display:flex;gap:22px;margin-top:16px;color:var(--mut);flex-wrap:wrap}
.facts div{display:flex;gap:7px;align-items:center}.facts b{color:var(--tx);font-weight:700}
.chart{height:150px}
.chart .ln{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.5s .2s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec h2{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}.sec h2 span{color:var(--faint);font-weight:500}
.seg{display:flex;background:var(--hover);border-radius:9px;padding:3px}
.seg button{padding:3px 13px;border-radius:7px;color:var(--mut);font-weight:500;font-size:12.5px}
.seg button.on{background:var(--panel);color:var(--tx);box-shadow:0 0 0 1px var(--line);font-weight:600}
.grp{margin:20px 0 4px;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;color:var(--mut);padding-inline:12px}
.row{display:grid;grid-template-columns:minmax(150px,1.2fr) 1.4fr 110px 56px 56px;gap:14px;align-items:center;padding:11px 14px;margin-top:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:background .12s,border-color .12s}
.row:hover{background:var(--hover);border-color:var(--line2)}.row.sel{background:var(--sel);border-color:var(--ac)}
.ut{display:none!important}
.ut{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--mut);font-weight:700;font-size:13px;background:var(--hover);border:1px solid var(--line)}
.row .nm{font-weight:600}.row .why{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .why.w{color:var(--risk);font-weight:500}
.mb{height:5px;border-radius:5px;background:var(--track);overflow:hidden}
.mb i{display:block;height:100%;width:0;border-radius:5px;background:currentColor;animation:fill 1s .15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fill{to{width:var(--w)}}
.v{font-weight:700;text-align:end}.d{font-size:12px;font-weight:600;text-align:end}
.glyph{display:grid;place-items:center}
.mx{display:grid;grid-template-columns:170px repeat(4,1fr);gap:5px;margin-top:8px}
.mx .h{font-size:12px;color:var(--faint);padding:4px 8px;font-weight:500;text-align:center}
.mx .u{padding:7px 8px;font-weight:600;display:flex;gap:10px;align-items:center}
.mx .c{padding:9px 0;text-align:center;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;transition:transform .12s}
.mx .c:hover{transform:scale(1.06)}
.mx .c.e{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--hover) 5px 10px);color:var(--faint);font-weight:400;font-size:11.5px;border:1px dashed var(--line2)}
/* goals */
.gl{display:grid;gap:12px;margin-top:14px}
.gr{display:grid;grid-template-columns:210px 1fr 54px 80px;gap:16px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.gr:hover{background:var(--hover);border-color:var(--line2)}
.gb{height:10px;border-radius:10px;background:var(--track);overflow:hidden}
.gb i{display:block;height:100%;width:0;border-radius:10px;background:var(--ac);animation:fill 1.1s .15s cubic-bezier(.2,.8,.2,1) forwards}
/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;line-height:21px;white-space:nowrap;background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--tx))}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.team{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mut)}
/* panel */
.peek{position:fixed;top:54px;bottom:0;inset-inline-end:0;width:420px;background:var(--panel);border-inline-start:1px solid var(--line);box-shadow:-8px 0 24px -12px rgba(0,0,0,.12);transform:translateX(-110%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;z-index:15;padding:22px;overflow:auto}
.peek.on{transform:none;visibility:visible}
.peek h3{font-size:17px;font-weight:600;line-height:1.7}
.peek .x{position:absolute;top:14px;inset-inline-end:14px}
.note{margin:14px 0;padding:12px 14px;border-radius:12px;background:var(--hover);color:var(--mut);line-height:1.9;font-size:12.5px}
.kr{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.kr:last-child{border:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:6px 15px;border-radius:9px;font-weight:600;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;transition:opacity .15s}
.btn:hover{opacity:.86}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--line2)}.btn.o:hover{background:var(--hover);opacity:1}
/* meeting */
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.mh h1{font-size:24px;font-weight:600;line-height:1.5}
.steps{display:flex;gap:5px;margin:16px 0 22px;flex-wrap:wrap;align-items:center}
.steps span{padding:3px 13px;border-radius:99px;font-size:12.5px;color:var(--faint);border:1px solid var(--line)}
.steps .dn{color:var(--mut);background:var(--hover)}
.steps .cur{border-color:transparent;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.og{margin:22px 0 4px;padding:12px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--line2)}
.og .no{font-size:11.5px;font-weight:600;color:var(--faint)}
.og b{font-weight:600}
.og .sc{margin-inline-start:auto;display:flex;gap:8px;align-items:center;font-weight:700}
.kh,.kr2{display:grid;grid-template-columns:42px minmax(220px,1fr) 104px 86px 76px minmax(150px,.7fr);gap:14px;align-items:center;padding:0 12px}
.kh{font-size:11.5px;color:var(--faint);padding-block:8px;margin-top:6px}
.kr2{padding-block:11px;margin-top:6px;border-radius:11px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:background .12s,border-color .12s}
.kr2:hover{background:var(--hover);border-color:var(--line2)}.kr2.sel{background:var(--sel);border-color:var(--ac)}
.kr2 .t{font-weight:500;line-height:1.6}.kr2 .m{display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
.inp{width:80px;text-align:center;font-weight:700;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);transition:.15s}
.inp:hover{border-color:var(--line2)}
.inp:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.nt{width:100%;padding:4px 9px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mut);font-size:12.5px;transition:.15s}
.nt:hover{background:var(--hover)}.nt:focus{outline:0;background:var(--panel);border-color:var(--ac);color:var(--tx)}
.pcell{display:flex;align-items:center;gap:8px;font-weight:700}
.all{width:100%;border-collapse:separate;border-spacing:0 0;font-size:12.5px}
.all th{font-size:11.5px;color:var(--faint);font-weight:600;padding:8px 8px;text-align:center;position:sticky;top:54px;background:var(--bg)}
.all th.cur{color:var(--ac)}
.all td{padding:8px;text-align:center;border-top:1px solid var(--line)}
.all td.l{text-align:start;min-width:230px}
.all td.f{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--hover) 5px 10px)}
.all .pp{font-size:11px;font-weight:700}
.foot{position:fixed;bottom:16px;inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);display:flex;gap:18px;align-items:center;padding:8px 16px;border-radius:13px;background:var(--panel);border:1px solid var(--line2);color:var(--mut);font-size:12.5px;box-shadow:0 8px 30px rgba(20,24,60,.1);z-index:10}
.foot span{display:flex;gap:6px;align-items:center}.saved{color:var(--ok);font-weight:600}
/* form */
.f{display:grid;gap:5px;margin-top:12px}.f label{font-size:12px;color:var(--mut);font-weight:600}
.f input,.f textarea,.f select{width:100%;padding:7px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);line-height:1.7}
.f textarea{resize:vertical;min-height:64px}
.f input:focus,.f textarea:focus,.f select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs);background:var(--panel)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv{display:grid;grid-template-columns:34px 1fr 50px;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.rv:last-child{border:0}
.rv .rn{font-weight:700;color:var(--ac);font-size:12px}
/* palette */
.ov{position:fixed;inset:0;background:rgba(12,14,30,.4);z-index:40;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.ov.on{display:flex;animation:in .2s both}
.pal{width:min(600px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.25);overflow:hidden}
.pal input{width:100%;border:0;background:none;padding:16px 18px;font-size:15px;border-bottom:1px solid var(--line);outline:0}
.pal .g{padding:10px 18px 4px;font-size:11.5px;color:var(--faint);font-weight:600}
.pal .it{display:flex;align-items:center;gap:12px;padding:9px 18px;cursor:pointer}.pal .it.on{background:var(--sel)}.pal .it .kbd{margin-inline-start:auto}
.pal .ft{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);color:var(--faint);font-size:12px}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:20px;padding:20px}.row{grid-template-columns:1fr 56px}.row .why,.row>.mbw,.row .d{display:none}.kh{display:none}.kr2{grid-template-columns:34px 1fr 80px}.kr2>.pcell,.kr2>.ntw{display:none}.gr{grid-template-columns:1fr 54px}.gr .gb{grid-column:1/-1;order:3}.cmd{min-width:0}.cmd span:not(.kbd){display:none}.tabs{display:none}.peek{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.mb i,.gb i{width:var(--w)}.chart .ln{stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="bar">
 <a class="logo" href="#"><i>O</i>OKR</a>
 <button class="ctx" aria-label="تغییر چرخه"><span class="lv"></span>بهار ۱۴۰۵<span class="mut">· پایش ۲</span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
 <nav class="tabs"><a class="tab on" data-go="dash" href="#">نمای کلی</a><a class="tab" data-go="meet" href="#">جلسه پایش</a><a class="tab" href="#">اهداف</a><a class="tab" href="#">گزارش‌ها</a></nav>
 <div class="sp"></div>
 <button class="cmd" id="open-pal"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>جستجو یا اجرای دستور…</span><span class="kbd">Ctrl K</span></button>
 <button class="ib" id="theme" aria-label="تغییر تم"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
 <div class="av">م</div>
</header>
<main class="page"><section class="screen on" id="dash"></section><section class="screen" id="meet"></section></main>
<aside class="peek" id="peek" aria-label="جزئیات"></aside>
<div class="foot" id="foot" style="display:none"><span><span class="kbd">J</span><span class="kbd">K</span> حرکت</span><span><span class="kbd">Enter</span> ویرایش مقدار</span><span><span class="kbd">Space</span> جزئیات KR</span><span class="saved" id="saved">ذخیره شد ✓</span></div>
<div class="ov" id="ov"><div class="pal" role="dialog" aria-label="پالت فرمان"><input id="q" placeholder="به کجا بروم؟ یا چه کاری انجام دهم؟" autocomplete="off"><div id="res" style="max-height:340px;overflow:auto;padding-bottom:6px"></div><div class="ft"><span><span class="kbd">↑</span><span class="kbd">↓</span> انتخاب</span><span><span class="kbd">Enter</span> اجرا</span><span><span class="kbd">Esc</span> بستن</span></div></div></div>

<script>
const fa=n=>Number(n).toLocaleString('fa-IR',{useGrouping:false,maximumFractionDigits:1});
const P=n=>fa(n)+'٪';
const st=p=>p==null?'none':p>=70?'ok':p>=40?'risk':'bad';
const stl={ok:'روی مسیر',risk:'در خطر',bad:'عقب',none:'ثبت نشده'};
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace('٫','.');
const pie=(p,c,s=15)=>`<svg class="i ${c||st(p)}" style="width:${s}px;height:${s}px" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--line2)" stroke-width="1.4"/>${p?`<circle cx="8" cy="8" r="3.25" fill="none" stroke="currentColor" stroke-width="6.5" stroke-dasharray="${p/100*20.42} 20.42" transform="rotate(-90 8 8)"/>`:''}</svg>`;
const calc=(b,g,v)=>{if(v===''||v==null||isNaN(v))return null;const p=g>b?(v-b)/(g-b):(b-v)/(b-g);return Math.round(Math.max(0,Math.min(1,p))*100)};
const GOALS=[['تحول دیجیتال و هوشمندسازی سازمان','--g0'],['ارتقای سرمایه انسانی و برند کارفرمایی','--g1'],['ارتقا و تثبیت جایگاه برند','--g2'],['تحقق تارگت فروش ریالی و تعدادی','--g3'],['تحقق سودآوری پایدار سازمان','--g4'],['توسعه سبد محصول مبتنی بر نیاز مشتری','--g5']];
const tag=g=>`<span class="tag" style="--c:var(${GOALS[g][1]})">${GOALS[g][0]}</span>`;
const UC=[['#3b6cf0','#6d8cff'],['#8b5cf6','#b69cff'],['#e5489b','#ff8cc3'],['#f08a24','#ffbb6b'],['#13a36b','#52d6a0'],['#0aa5b8','#55d7e6']];
const U=[
 {n:'تولید',t:'معاونت',p1:55,p2:41,d:-14,k:22,w:'افت ۱۴٪ نسبت به پایش ۱ — ۱۳ KR نیازمند توجه',a:1},
 {n:'مالی',t:'معاونت',p1:58,p2:null,d:0,k:13,w:'زمان جلسهٔ پایش ۲ تعیین نشده',a:1},
 {n:'تدارکات',t:'مدیریت',p1:36,p2:47,d:11,k:12,w:'۳ KR ثبت‌نشده',a:1},

const CMDS=[['برو به',[['نمای کلی سازمان','G D',()=>go('dash')],['جلسهٔ پایش ۲ · فناوری اطلاعات','G M',()=>go('meet')],['اهداف','G O'],['گزارش‌ها','G R'],['همترازی','G A'],['تعهدات','G C']]],['اقدام',[['تعریف KR جدید…','N',()=>{go('meet');krForm(null)}],['ثبت مقدار برای KR…','V'],['برنامه‌ریزی جلسهٔ مالی','S'],['خروجی Excel با چیدمان فعلی','E'],['تغییر تم روشن/تیره','T',()=>toggleTheme()]]],['واحدها',U.slice(0,4).map((u,i)=>['باز کردن '+u.n,'',()=>{go('dash');setTimeout(()=>peekU(i),60)}])]];
let pi=0,flat=[];
function pal(q=''){flat=[];let h='';CMDS.forEach(([g,it])=>{const m=it.filter(i=>i[0].includes(q));if(!m.length)return;h+=`<div class="g">${g}</div>`;m.forEach(i=>{h+=`<div class="it ${flat.length===pi?'on':''}" data-i="${flat.length}"><span>${i[0]}</span>${i[1]?`<span class="kbd">${i[1]}</span>`:''}</div>`;flat.push(i)})});document.getElementById('res').innerHTML=h||'<div class="it mut">نتیجه‌ای نیست</div>';document.querySelectorAll('#res .it[data-i]').forEach(e=>e.onclick=()=>run(+e.dataset.i))}
const run=i=>{const f=flat[i];closePal();f&&f[2]&&f[2]()};
function openPal(){pi=0;document.getElementById('ov').classList.add('on');const q=document.getElementById('q');q.value='';pal();q.focus()}
function closePal(){document.getElementById('ov').classList.remove('on')}
document.getElementById('open-pal').onclick=openPal;document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closePal()};
document.getElementById('q').oninput=e=>{pi=0;pal(e.target.value)};
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return}
 if(document.getElementById('ov').classList.contains('on')){if(e.key==='Escape')closePal();else if(e.key==='ArrowDown'){pi=Math.min(flat.length-1,pi+1);pal(document.getElementById('q').value);e.preventDefault()}else if(e.key==='ArrowUp'){pi=Math.max(0,pi-1);pal(document.getElementById('q').value);e.preventDefault()}else if(e.key==='Enter')run(pi);return}
 const t=document.activeElement.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'){if(e.key==='Escape'||(e.key==='Enter'&&t==='INPUT'&&document.activeElement.classList.contains('inp'))){document.activeElement.blur();e.preventDefault()}return}
 if(e.key==='Escape'){closePeek();return}
 if(!document.getElementById('meet').classList.contains('on')||!window.__rows)return;const R=window.__rows;
 if(e.key==='j'||e.key==='ArrowDown'){R.sel(R.idx+1);e.preventDefault()}else if(e.key==='k'||e.key==='ArrowUp'){R.sel(R.idx-1);e.preventDefault()}
 else if(e.key==='Enter'&&R.idx>=0){R.rows[R.idx].querySelector('.inp').focus();e.preventDefault()}
 else if(e.key===' '&&R.idx>=0){krForm(ALLK[+R.rows[R.idx].dataset.k],R.rows[R.idx]);e.preventDefault()}});
function toggleTheme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'':'dark'}
document.getElementById('theme').onclick=toggleTheme;
dash();meet();
const q=new URLSearchParams(location.search);
if(q.get('s')==='meet')go('meet');if(q.get('m')==='all')meet('all');if(q.get('theme')==='dark')toggleTheme();
if(q.get('v')){const b=document.querySelector(`#vseg [data-v=${q.get('v')}]`);b&&b.click()}
if(q.get('peek')!==null)peekU(+q.get('peek'));if(q.get('kr')!==null){go('meet');krForm(ALLK[+q.get('kr')])}if(q.get('pal')!==null)openPal();

</script>
